<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bishopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48c774"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background circle for favicon clarity -->
  <rect width="100" height="100" rx="22" fill="#0c1017"/>
  <rect x="1" y="1" width="98" height="98" rx="21" stroke="#2a364a" stroke-width="2"/>
  
  <!-- Tilted Bishop at 16 degrees -->
  <g transform="rotate(16, 50, 52) translate(0, -2)" filter="url(#shadow)">
    <!-- Finial (top cross sphere) -->
    <circle cx="50" cy="18" r="3.5" fill="url(#bishopGrad)"/>
    
    <!-- Bishop Mitre / Head with slice notch -->
    <path d="M 44 26 
             C 41 33, 40 43, 43 51
             C 45 54, 55 54, 57 51
             C 60 43, 59 33, 56 26
             C 54 22, 46 22, 44 26 Z" 
          fill="url(#bishopGrad)"/>
          
    <!-- Mitre cut / notch -->
    <path d="M 46 32 L 53 40" stroke="#0c1017" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Neck ring -->
    <rect x="42" y="52" width="16" height="4" rx="2" fill="#ffffff" opacity="0.9"/>
    
    <!-- Body waist -->
    <path d="M 44 56 C 44 65, 38 72, 34 76 L 66 76 C 62 72, 56 65, 56 56 Z" fill="url(#bishopGrad)"/>
    
    <!-- Base pedestal -->
    <path d="M 31 77 C 31 76, 69 76, 69 77 L 72 82 C 72 83, 28 83, 28 82 Z" fill="#ffffff" opacity="0.95"/>
    <rect x="25" y="83" width="50" height="4.5" rx="2" fill="url(#bishopGrad)"/>
  </g>
</svg>

